name: npm-publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Job-level `container:` + ocaml/opam hits uid/shell issues with Actions.
      # Build inside Docker from the host runner instead (static Alpine binary).
      - name: Install dependencies and build static binary
        run: |
          # Host workspace is uid 1001; container user opam is 1000 and must write _build.
          chmod -R a+rwX packages/ppx

          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work/packages/ppx \
            ocaml/opam:alpine-3.20-ocaml-4.14 \
            sh -lc 'opam install . --deps-only -y && opam exec -- dune build --profile static'

          sudo cp packages/ppx/_build/default/bin/bin.exe ppx-linux-x64.exe
          sudo chown "$(id -u):$(id -g)" ppx-linux-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: ppx-linux-x64.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4.14.2

      - name: Build
        working-directory: packages/ppx
        run: |
          opam install . --deps-only -y
          opam exec -- dune build
          cp _build/default/bin/bin.exe "$GITHUB_WORKSPACE/ppx-osx-arm64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: ppx-osx-arm64.exe

  release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: artifacts

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/

      # Trusted publishing needs npm >= 11.5.1
      - name: Ensure npm supports OIDC
        run: npm install -g npm@^11.5.1

      - name: Pack and publish
        working-directory: packages/ppx
        run: |
          cp ../../artifacts/ppx-osx-arm64.exe .
          cp ../../artifacts/ppx-linux-x64.exe .
          # Do not set NODE_AUTH_TOKEN — OIDC trusted publisher authenticates publish.
          # Provenance is generated automatically with trusted publishing.
          npm publish --access public
